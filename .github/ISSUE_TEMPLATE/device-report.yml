name: Device report
description: Tried Hugminn on a device? Send the result of the device test (Settings → Help & about → Device test) or of the setup.
title: "[Device] "
labels: ["device"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Retroid Pocket G2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hugminn version
      placeholder: e.g. 1.12.0
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: Root
      options: ["No root", "Rooted"]
  - type: textarea
    id: results
    attributes:
      label: Test result
      description: Filled in by Hugminn's device test or setup (✓ works, ⚠ limited, ✗ not available). No names, Wi-Fi names, games or location.
  - type: textarea
    id: problems
    attributes:
      label: What doesn't work or looks wrong?
      description: Anything you noticed yourself. Screenshots help a lot – please blur private info such as Wi-Fi names.
