name: Device report
description: Tried Hugminn on a device that isn't tested yet? Tell us how it went.
title: "[Device] "
labels: ["device"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Retroid Pocket G2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hugminn version
      placeholder: e.g. 1.10.17
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Setup wizard / permissions
        - label: Control Center opens (Home button)
        - label: Game switcher (Muninn) opens
        - label: Performance modes
        - label: Fan control
        - label: Controller style / LED
        - label: Brightness, volume, Wi-Fi, Bluetooth tiles
  - type: textarea
    id: problems
    attributes:
      label: What doesn't work or looks wrong?
      description: Screenshots help a lot. Please blur private info such as Wi-Fi names.
  - type: dropdown
    id: root
    attributes:
      label: Root
      options: ["No root", "Rooted"]
