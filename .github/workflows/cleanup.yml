name: Remove old test releases

# Run by hand (Actions → "Remove old test releases" → Run workflow): deletes every release and tag
# from before 1.0.0 (v0.x and the old "latest" test build) and the old feedback branch. Releases from 1.0.0 on stay.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases before 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list -R "$REPO" -L 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in
              v0.*|latest) echo "delete $tag"; gh release delete "$tag" -R "$REPO" --yes --cleanup-tag ;;
              *) echo "keep $tag" ;;
            esac
          done

      - name: Delete the old feedback branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$REPO/git/refs/heads/feedback" || echo "feedback branch already gone"
