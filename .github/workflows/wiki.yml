name: Wiki

# Publishes the pages in wiki/ to the GitHub wiki of this repository.
on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo; then
            echo "::error::The wiki is not set up yet: turn on Wikis in the repository settings and create the first page once."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki unchanged"; exit 0; fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
