name: Update release notes

# Run by hand (Actions → "Update release notes" → Run workflow): rewrites the notes of every
# existing release from its section in CHANGELOG.md, so older releases get the current layout.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '.[] | select(.prerelease | not) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            V="${tag#v}"
            section="$(awk -v v="## $V" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md)"
            if [ -z "$(echo "$section" | tr -d '[:space:]')" ]; then
              echo "skip $tag (no section)"; continue
            fi
            {
              echo "Hugminn $V. Install \`hugminn.apk\` on the handheld, or keep it up to date with Obtainium."
              echo
              echo "## What's new · Neu"
              echo "$section"
            } > notes.md
            gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F body=@notes.md --jq '.tag_name' >/dev/null
            echo "updated $tag"
          done
