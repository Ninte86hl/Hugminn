name: Build Hugminn

# main → release "Hugminn vX.Y.Z" · test → pre-release "Hugminn Test vX.Y.Z"
on:
  push:
    branches: [main, test]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            # no release key: build anyway (to check the code), but publish nothing
            echo "::warning::Secrets SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD are missing (Settings → Secrets and variables → Actions). Nothing is published."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_KEY=true" >> "$GITHUB_ENV"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HUGMINN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HUGMINN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk hugminn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hugminn
          path: hugminn.apk

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hugminn v${{ steps.ver.outputs.name }}
          prerelease: false
          make_latest: true
          files: |
            hugminn.apk
            obtainium.json
          body: |
            Hugminn ${{ steps.ver.outputs.name }}. Install `hugminn.apk` on the handheld, or keep it up to date with Obtainium.

      - name: Remove older test builds (only the newest one stays)
        if: github.ref == 'refs/heads/test' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in
              test-v${{ steps.ver.outputs.name }}) ;;
              test-*) gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag ;;
            esac
          done

      - name: Publish test build
        if: github.ref == 'refs/heads/test' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v${{ steps.ver.outputs.name }}
          name: Hugminn Test v${{ steps.ver.outputs.name }}
          prerelease: true
          make_latest: false
          files: |
            hugminn.apk
          body: |
            Test build ${{ steps.ver.outputs.name }} from the `test` branch, with diagnostic tools (feedback upload, input and LED tests).
