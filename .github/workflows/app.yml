name: Build Hugminn

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hugminn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hugminn
          path: hugminn.apk

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish versioned pre-release (for Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hugminn v${{ steps.ver.outputs.name }}
          prerelease: true
          make_latest: false
          files: hugminn.apk
          body: |
            Test build ${{ steps.ver.outputs.name }} of Hugminn. Install `hugminn.apk` on the handheld.

      - name: Publish as pre-release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hugminn (test build)
          prerelease: true
          make_latest: false
          files: hugminn.apk
          body: |
            Current test build of Hugminn. Download `hugminn.apk` below and install it on the handheld.
            Test builds are signed with a fixed test key, so new builds install over old ones.
